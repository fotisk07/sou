[package]
name = "sou"
version = "0.3.0"
edition = "2024"
repository = "https://github.com/fotisk07/sou"
homepage = "https://github.com/fotisk07/sou"
description = "Personal double-entry accounting in a plain-text journal"

[[bin]]
name = "sou"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
csv = "1.4.0"
genpdf = "0.2.0"
jiff = "0.2.37"
rust_decimal = "1.43.0"
rust_xlsxwriter = "0.103.0"
tabled = "0.22.0"
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
